name: Branch flow

# Changes reach main only through dev: feature -> dev -> main.
on:
  pull_request:
    branches: [main]

jobs:
  from-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Pull requests into main must come from dev
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "Pull requests into main must come from dev (this one is from '$HEAD_REF')."
            echo "Open the pull request into dev instead."
            exit 1
          fi
